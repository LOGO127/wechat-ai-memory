[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wechat-context-exporter"
version = "0.3.6"
description = "A local-first WeChat AI memory archive for Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "WeChat AI Memory contributors" }]
dependencies = [
  "frida>=17,<18",
  "imageio-ffmpeg>=0.6,<1",
  "Pillow>=10.4,<12",
  "pywinauto>=0.6.9,<1",
  "pycryptodome>=3.21,<4",
  "reportlab>=4.2,<5",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
build = ["pyinstaller>=6.11,<7"]
dev = [
  "pypdf>=5,<7",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
wechat-context-exporter = "wechat_context_exporter.cli:main"
wechat-context-exporter-gui = "wechat_context_exporter.ui.main_window:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_context_exporter"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
