name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv-gui
          .\.venv-gui\Scripts\python.exe -m pip install -e ".[gui,build,dev]"
      - name: Test source
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv-gui\Scripts\python.exe -m pytest
      - name: Build Windows packages
        run: .\scripts\build_windows.ps1 -SkipInstall
      - name: Verify packaged GUI and outputs
        run: .\scripts\verify_windows_release.ps1
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: WeChatAIMemory-Windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            outputs/WeChatAIMemory-Windows-x64.zip
            outputs/WeChatAIMemory-Portable.exe
            outputs/SHA256SUMS.txt
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $Version = (& .\.venv-gui\Scripts\python.exe -c "from wechat_context_exporter import __version__; print(__version__)").Trim()
          $Pattern = '^v' + [regex]::Escape($Version) + '($|-)'
          if ($env:GITHUB_REF_NAME -notmatch $Pattern) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $Version"
          }
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Arguments = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "outputs/WeChatAIMemory-Windows-x64.zip",
            "outputs/WeChatAIMemory-Portable.exe",
            "outputs/SHA256SUMS.txt",
            "--verify-tag", "--generate-notes"
          )
          if ($env:GITHUB_REF_NAME -match "-") { $Arguments += "--prerelease" }
          gh @Arguments
